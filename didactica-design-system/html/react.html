<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Didáctica Universitaria — React</title>
  <link rel="stylesheet" href="../dist/tokens.css">
  <link rel="stylesheet" href="../dist/didactica.css">
  <style>body { margin: 0; background: var(--band); padding: var(--space-16pt) var(--space-9pt); }</style>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="../dist/didactica.iife.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const h = React.createElement;
    const { Page, TableOfContents, Heading, Paragraph, ConceptBox, DataTable, BulletList } = window.Didactica;
    ReactDOM.createRoot(document.getElementById('root')).render(
      h(Page, { header: 'Didáctica de la Educación Superior', page: 12 },
        h(TableOfContents, { entries: [
          { title: 'Unidad 2. Teorías del aprendizaje en la educación superior', page: 12 },
          { title: '2.1. Constructivismo y aprendizaje significativo', page: 12, level: 2 },
          { title: '2.2. La perspectiva sociocultural', page: 13, level: 2 },
        ] }),
        h(Heading, { level: 1 }, 'Unidad 2. Teorías del aprendizaje en la educación superior'),
        h(Heading, { level: 2 }, '2.2. La perspectiva sociocultural'),
        h(Paragraph, null, 'Vygotsky (1978) desplazó el foco desde el individuo hacia la matriz social del aprendizaje.'),
        h(ConceptBox, { term: 'Zona de desarrollo próximo (ZDP)' },
          'Franja entre el nivel de desarrollo real (lo que el estudiante resuelve solo) y el potencial (lo que resuelve con ayuda).'),
        h(DataTable, {
          number: 2, widths: ['22%', '39%', '39%'],
          caption: 'Teorías del aprendizaje e implicancias didácticas. Elaboración propia.',
          columns: ['Perspectiva', 'Cómo concibe el aprendizaje', 'Implicancia para enseñar'],
          rows: [
            ['Conductista', 'Cambio de conducta por asociación y refuerzo', 'Objetivos claros, práctica y retroalimentación inmediata'],
            ['Cognitivista', 'Procesamiento de información; esquemas y memoria', 'Gestionar la carga cognitiva; organizar y secuenciar'],
            ['Constructivista', 'Construcción activa sobre ideas previas', 'Indagar preconceptos; proponer problemas significativos'],
          ],
        }),
        h(BulletList, { items: ['Planificar sistemas de evaluación válidos, formativos y sostenibles.'] })
      )
    );
  </script>
</body>
</html>
