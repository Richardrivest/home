<div class="cover">
  <!--
    blocks: navy 384×112, azure 192×112, objectives-accent 144×112, important-accent 96×112, keypoints-border 144×112 (widths in indent-hang 48px steps; height 7 × space-4)
    arrangement: top-band skeleton (the name is too wide for the 440px zone), a flush strip of unequal bands bleeding off the top and right edges; the two brand inks lead, two box accents follow, one tint for relief
    pattern: editorial row ("serif reading text, rules that carry meaning"): the cover ribbon's two stroke-ribbon rules plus one stroke-hair rule, cut in paper across every block
    scales: indent-hang 48px, space-4 16px, space-5 24px, stroke-ribbon 1.33px, stroke-hair 1px, radius-none 0
  -->
  <svg class="band" viewBox="0 0 960 112" width="960" height="112" aria-hidden="true">
    <rect class="b-navy" x="0" y="0" width="384" height="112"/>
    <rect class="b-azure" x="384" y="0" width="192" height="112"/>
    <rect class="b-teal" x="576" y="0" width="144" height="112"/>
    <rect class="b-amber" x="720" y="0" width="96" height="112"/>
    <rect class="b-tint" x="816" y="0" width="144" height="112"/>
    <line class="r-ribbon" x1="0" y1="48" x2="960" y2="48"/>
    <line class="r-ribbon" x1="0" y1="72" x2="960" y2="72"/>
    <line class="r-hair" x1="0" y1="96" x2="960" y2="96"/>
  </svg>
  <div class="text">
    <h1 class="name">Didáctica Universitaria</h1>
    <p class="tagline">Fundamentos, estrategias y evaluación para la docencia universitaria</p>
  </div>
</div>
<style>
  html, body { margin: 0; background: var(--paper); }

  .b-navy { fill: var(--navy); }
  .b-azure { fill: var(--azure); }
  .b-teal { fill: var(--objectives-accent); }
  .b-amber { fill: var(--important-accent); }

</style>
